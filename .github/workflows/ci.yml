name: Midnight CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies for Compact Compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev libgmp-dev pkg-config

      - name: Install Compact Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pin Compact Compiler Version
        run: |
          compact update 0.31.1
          echo "ACTUAL COMPILER VERSION:"
          compact --version

      - name: Compile Membership Contract
        run: |
          mkdir -p managed/Membership
          compact compile contracts/Membership.compact managed/Membership 2>&1 || {
            echo "--- Compact compile failed. Checking for diagnostic info ---"
            ls -la "$HOME/.compact/" 2>/dev/null || true
            ls -la "$HOME/.local/bin/" 2>/dev/null || true
            file "$HOME/.local/bin/compact" 2>/dev/null || true
            ldd "$HOME/.local/bin/compact" 2>/dev/null || true
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Verify Generated Output and Print Details
        run: |
          echo "GENERATED CONTRACT FILES:"
          ls -la managed/Membership/contract/
          echo "GENERATED COMPILER METADATA:"
          ls -la managed/Membership/compiler/
          echo "GENERATED KEYS:"
          ls -la managed/Membership/keys/
          echo "GENERATED ZKIR:"
          ls -la managed/Membership/zkir/

          echo "SIZES OF ZK ARTIFACTS:"
          # Dynamically detect keys and zkir filenames to print their sizes
          find managed/Membership/keys/ -type f -exec wc -c {} +
          find managed/Membership/zkir/ -type f -exec wc -c {} +

          # Fail if any pk, vk, or zkir is missing or zero-sized
          PK_FILE=$(find managed/Membership/keys/ -name "registerMember.pk" -o -name "registerMember.prover" | head -n 1)
          VK_FILE=$(find managed/Membership/keys/ -name "registerMember.vk" -o -name "registerMember.verifier" | head -n 1)
          ZKIR_FILE=$(find managed/Membership/zkir/ -name "registerMember.zkir" -o -name "registerMember.bzkir" | head -n 1)

          if [ -z "$PK_FILE" ] || [ ! -s "$PK_FILE" ]; then
            echo "FAIL: registerMember proving key is missing or zero bytes!"
            exit 1
          fi
          if [ -z "$VK_FILE" ] || [ ! -s "$VK_FILE" ]; then
            echo "FAIL: registerMember verification key is missing or zero bytes!"
            exit 1
          fi
          if [ -z "$ZKIR_FILE" ] || [ ! -s "$ZKIR_FILE" ]; then
            echo "FAIL: registerMember ZKIR is missing or zero bytes ($ZKIR_FILE)!"
            exit 1
          fi

          # Verify that the generated file contains checkRuntimeVersion
          echo "GENERATED RUNTIME VERSION REQUIREMENT:"
          grep -o "checkRuntimeVersion('[^']*')" managed/Membership/contract/index.js || grep -o "checkRuntimeVersion('[^']*')" managed/Membership/contract/index.cjs || true

          # Assert Contract export is a function
          node -e "
            const fs = require('fs');
            const file = fs.existsSync('managed/Membership/contract/index.js') ? 'managed/Membership/contract/index.js' : 'managed/Membership/contract/index.cjs';
            console.log('Loading contract module from:', file);
            import('./' + file)
              .then(m => {
                const Contract = m.Contract;
                console.log('Contract export exists:', !!Contract);
                console.log('typeof Contract:', typeof Contract);
                if (typeof Contract !== 'function') {
                  console.error('FAIL: Contract is not a constructor/class!');
                  process.exit(1);
                }
                console.log('SUCCESS: Contract is a valid constructor/class');
              })
              .catch(err => {
                console.error('Import failed:', err);
                process.exit(1);
              });
          "

      - name: Run test suite
        run: npm test

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Print Installed Frontend Runtime Versions
        working-directory: ./frontend
        run: |
          echo "INSTALLED COMPACT-JS VERSION:"
          npm list @midnight-ntwrk/compact-js || true
          echo "INSTALLED COMPACT-RUNTIME VERSION:"
          npm list @midnight-ntwrk/compact-runtime || true

      - name: Sync Artifacts to Frontend
        run: |
          # Sync build-time imports
          rm -rf frontend/src/managed/Membership
          mkdir -p frontend/src/managed/Membership
          cp -r managed/Membership/* frontend/src/managed/Membership/
          
          # Sync runtime ZK assets to public folder
          mkdir -p frontend/public/keys
          mkdir -p frontend/public/zkir
          cp managed/Membership/keys/* frontend/public/keys/
          cp managed/Membership/zkir/* frontend/public/zkir/

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload Compiled Membership Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-membership-artifacts
          path: managed/Membership/

