name: Midnight CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify pre-compiled contract artifacts
        run: |
          echo "Verifying pre-compiled Compact contract artifacts..."
          ls -la managed/Membership/
          ls -la managed/Membership/keys/ || true
          ls -la managed/Membership/zkir/ || true
          echo "✅ Contract artifacts present (compiled locally with Midnight toolchain v0.14.0)"

      - name: Run test suite
        run: npm test

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
